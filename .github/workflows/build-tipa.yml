name: Build TIPA

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned, device)
        run: |
          set -e
          mkdir -p "$PWD/build/Release-iphoneos"
          xcodebuild -project LiDARScan3MF.xcodeproj \
            -target LiDARScan3MF \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO

      - name: Find built .app
        run: |
          echo "--- build dir ---"
          ls -la "$PWD/build/Release-iphoneos" || true
          echo "--- search .app ---"
          find "$PWD/build" -maxdepth 3 -name "*.app" || true

      - name: Package .tipa
        run: |
          set -e
          APP=$(find "$PWD/build" -maxdepth 3 -name "LiDARScan3MF.app" | head -n 1)
          echo "Found app: $APP"
          test -n "$APP"
          test -d "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry LiDARScan3MF.tipa Payload
          ls -lh LiDARScan3MF.tipa
          echo "---- tipa 内部结构 ----"
          unzip -l LiDARScan3MF.tipa | head -n 15

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiDARScan3MF-tipa
          path: LiDARScan3MF.tipa
          if-no-files-found: error
